name: Phase 4H dependency sync

on:
  push:
    paths:
      - ".github/workflows/phase4h-deps.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: npm
      - name: Install Expo SDK 54 offline dependencies
        run: npx expo install expo-file-system expo-network --npm
      - name: Commit lockfile and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/phase4h-deps.yml
          git commit -m "chore: add Phase 4H offline dependencies"
          git push origin HEAD:main
